name = "delivery-service"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# "mock" works with no keys. "lalamove" or "uber" once you have test credentials.
PROVIDER = "mock"
# US: use "uber". Lalamove does not operate in the US.
CURRENCY = "USD"
COUNTRY = "US"
# The bakery (pickup point). Placeholder shop location in Los Angeles; change to your city.
PICKUP_NAME = "KUKI"
PICKUP_ADDRESS = "3900 W Sunset Blvd, Los Angeles, CA 90029"
PICKUP_LAT = "34.0912"
PICKUP_LNG = "-118.2786"
PICKUP_PHONE = "+13235550100"
# Mock only: real minutes per delivery stage (keep small for demos).
MOCK_MINUTES_PER_STAGE = "1"
LALAMOVE_BASE_URL = "https://rest.sandbox.lalamove.com"
LALAMOVE_MARKET = "MX"
LALAMOVE_SERVICE_TYPE = "MOTORCYCLE"
# Uber Direct test mode: robo courier moves deliveries through statuses automatically.
UBER_ROBO_COURIER = "true"

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars locally):
#   QUOTE_SECRET          signs quote tokens (required)
#   SERVICE_TOKEN         optional bearer token the agent must send
#   LALAMOVE_API_KEY
#   LALAMOVE_API_SECRET
#   UBER_CUSTOMER_ID, UBER_CLIENT_ID, UBER_CLIENT_SECRET  (direct.uber.com → Developer)
